<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mountain.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faktorio – fakturace zdarma pro živnostníky a malé firmy</title>
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#020817"
    />
    <script>
      // Apply the stored or system theme before the first paint to avoid a light flash; next-themes takes over after load
      try {
        const theme = localStorage.getItem('theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <meta
      name="description"
      content="Faktorio je open-source fakturační software pro živnostníky a malé firmy. Alternativa k Fakturoidu a iDokladu – faktury, DPH a XML exporty navždy zdarma."
    />
    <link rel="canonical" href="https://faktorio.cz/" />
    <link rel="alternate" href="https://faktorio.cz/" hreflang="cs" />
    <link rel="alternate" href="https://faktorio.cz/" hreflang="x-default" />

    <!-- Open Graph: 1200×630 (1.91:1). Images are generated by scripts/generate-social-images.mts -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://faktorio.cz/" />
    <meta property="og:site_name" content="Faktorio" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:title" content="Faktorio – fakturace bez zbytečností" />
    <meta
      property="og:description"
      content="Vystavujte faktury zdarma, rychle a bez zbytečností."
    />
    <meta
      property="og:image"
      content="https://faktorio.cz/social/og-image.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo a název Faktorio na tmavém pozadí"
    />
    <!-- JPEG fallback for crawlers that do not read WebP -->
    <meta
      property="og:image"
      content="https://faktorio.cz/social/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo a název Faktorio na tmavém pozadí"
    />

    <!-- X card: summary_large_image needs a 2:1 image (1200×600), otherwise X shows a small thumbnail -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Faktorio – fakturace bez zbytečností" />
    <meta
      name="twitter:description"
      content="Vystavujte faktury zdarma, rychle a bez zbytečností."
    />
    <meta
      name="twitter:image"
      content="https://faktorio.cz/social/twitter-card.webp"
    />
    <meta
      name="twitter:image:alt"
      content="Logo a název Faktorio na tmavém pozadí"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Faktorio",
        "url": "https://faktorio.cz/",
        "logo": "https://faktorio.cz/presskit/logo.png",
        "sameAs": [
          "https://github.com/capaj/faktorio",
          "https://twitter.com/capajj"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Faktorio",
        "url": "https://faktorio.cz/",
        "image": "https://faktorio.cz/social/og-image.jpg",
        "inLanguage": "cs-CZ"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // #root holds the prerendered landing page. This file is also served for every other
      // route and to signed-in visitors, who must not see the landing page before the app loads.
      try {
        if (
          location.pathname !== '/' ||
          localStorage.getItem('auth_user') ||
          localStorage.getItem('faktorio_local_user')
        ) {
          document.getElementById('root').replaceChildren()
        }
      } catch {}
    </script>
    <div id="portal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
